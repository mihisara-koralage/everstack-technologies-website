<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <meta name="description" content="Everstack Technologies designs, develops, deploys, and maintains reliable digital solutions for businesses in Sri Lanka and beyond." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Everstack Technologies — Building Today. Sustaining Tomorrow." />
    <meta property="og:description" content="Reliable software engineering, modern web applications, and cloud & DevOps solutions." />
    <meta property="og:image" content="/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/images/everstack-emblem.png" />
    <link rel="apple-touch-icon" href="/images/everstack-emblem.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>Everstack Technologies | Building Today. Sustaining Tomorrow.</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Netlify detects this static form at build/deploy time. Keep it in the body. -->
    <form name="everstack-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="everstack-contact" />
      <input name="name" />
      <input name="email" />
      <input name="company" />
      <input name="subject" />
      <textarea name="message"></textarea>
      <input name="bot-field" />
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
